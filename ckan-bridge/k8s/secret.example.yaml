apiVersion: v1
kind: Secret
metadata:
  name: ckan-bridge-secrets
  namespace: ckan-bridge
  labels:
    app.kubernetes.io/name: ckan-bridge
type: Opaque
stringData:
  # PLACEHOLDER — replace with real values before applying.
  # In production, use a sealed-secret or external-secrets operator.
  ckan-api-token: 'REPLACE_WITH_CKAN_API_TOKEN'
  bridge-dpop-key: 'REPLACE_WITH_DPOP_PRIVATE_KEY_PEM'
  webhook-secret: 'REPLACE_WITH_HMAC_SHARED_SECRET'
---
apiVersion: v1
kind: Secret
metadata:
  name: ckan-bridge-profile
  namespace: ckan-bridge
  labels:
    app.kubernetes.io/name: ckan-bridge
type: Opaque
stringData:
  # PLACEHOLDER — replace with the program profile JSON.
  program-profile.json: |
    {
      "organisation": "REPLACE_WITH_ORG_ID",
      "program": "REPLACE_WITH_PROGRAM_ID",
      "serviceIdentity": "https://databox.example.org/agents/ckan-bridge",
      "issuer": "https://databox.example.org/issuers/org",
      "ckanOrganizationId": "REPLACE_WITH_CKAN_ORG_ID"
    }
