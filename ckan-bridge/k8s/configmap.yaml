apiVersion: v1
kind: ConfigMap
metadata:
  name: ckan-bridge-config
  namespace: ckan-bridge
  labels:
    app.kubernetes.io/name: ckan-bridge
data:
  CKAN_BASE_URL: 'https://ckan.example.org/'
  BRIDGE_MAX_RETRIES: '5'
  BRIDGE_RECONCILIATION_INTERVAL: '300'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ckan-bridge-shacl-shapes
  namespace: ckan-bridge
  labels:
    app.kubernetes.io/name: ckan-bridge
data:
  shapes.ttl: |
    # SHACL shapes for CKAN bridge publication validation.
    # Loaded by the bridge from /config/shapes.ttl.
    # See databox/compliance/compliance.ttl for the full vocabulary.
    @prefix sh: <http://www.w3.org/ns/shacl#> .
    @prefix dbx: <https://dev.linkeddata.au/def/solid-databox-compliance#> .
    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
